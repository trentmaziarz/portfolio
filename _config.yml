title: "Trent Maziarz"
description: "Trent Maziarz"
url: "https://trentmaziarz.com"
baseurl: ""
theme: null

defaults:
  - scope:
      path: ""
    values:
      layout: poster

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

redirect_from:
  json: false

exclude:
  - node_modules
  - README.md
  - Gemfile
  - Gemfile.lock
  - _archive
