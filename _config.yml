title: "Trent Maziarz"
description: "Computer science, Buhurt, and the family grease."
url: "https://trentmaziarz.com"
baseurl: ""

collections:
  projects:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "_posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project

# Stripe checkout link for the Wares page; leave empty until batch one is ready to sell
stripe_link: ""

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - _archive
